name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build
        run: dotnet build DockerDotnetTemplate.slnx -c Release

      - uses: github/codeql-action/analyze@v4
