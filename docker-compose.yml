services:
  api:
    build:
      context: .
    image: docker-dotnet-template:0.1.0
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TemplateApi__ServiceName: ${TemplateApi__ServiceName:-docker-dotnet-template}
      TemplateApi__Version: ${TemplateApi__Version:-0.1.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
